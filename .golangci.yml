# golangci-lint configuration for github.com/womat/golib/v2.
#
# Run it through scripts/check.sh rather than directly: the module under
# demo/demo_app is invisible to a root-level ./..., and the script also
# generates the certificate that module embeds.
#
# The default linter set is kept. The exclusions below are decisions, not
# convenience - each one says why.

version: "2"

linters:
  settings:
    errcheck:
      # This library's convention is that every resource-owning type has an
      # explicit Close that callers must defer (see CLAUDE.md). A deferred
      # Close has nowhere to return an error to, so errcheck and the
      # convention are in direct conflict; the convention wins. Listed
      # explicitly rather than switching errcheck off, so an unchecked error
      # from anything else still gets reported.
      exclude-functions:
        - (*github.com/womat/golib/v2/xlog.LoggerWrapper).Close

  exclusions:
    rules:
      # Test code may ignore what it is not asserting on: a deferred Close, an
      # os.Remove of a temporary directory. Reporting those buries the findings
      # that matter under a list of things nobody intends to handle.
      - path: _test\.go
        linters:
          - errcheck
