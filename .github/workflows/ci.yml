# Continuous integration for github.com/womat/golib/v2.
#
# Why this exists: a demo_app that did not compile went unnoticed for months
# once, and the services built on this library run on Linux (a Raspberry Pi)
# while it is written on macOS. The jobs run on Linux, the platform that ships.
#
# demo/demo_app is a separate Go module with its own go.mod and a replace
# directive pointing at the repository root, so a root-level "go build ./..."
# ignores it entirely. It gets its own jobs.
#
# Actions are pinned to a commit SHA, with the release in a comment: a tag like
# @v7 can be moved to other code, a SHA cannot. dependabot (.github/dependabot.yml)
# proposes updates for them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref supersedes a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Covers the demo modules too - gofmt does not care about module
      # boundaries, and running it once is cheaper than once per module.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  checks:
    name: fix, lint, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned rather than @latest: a new release of either tool would
      # otherwise turn this job red without a change in this repository. Raise
      # them deliberately - dependabot does not see a go install line.
      - name: install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # The same script a developer runs, so the two cannot drift. --check makes
      # go fix report a pending diff and exit non-zero instead of writing it.
      # Note this will go red on its own when a future Go release adds a fixer:
      # that is the point, and "scripts/check.sh" applies what it wants.
      - name: scripts/check.sh --check
        run: scripts/check.sh --check

  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Every module in this repository declares the same Go version, and
          # go-version-file keeps the workflow from drifting away from it.
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      # -race because the middleware runs on every request goroutine at once,
      # and the logging middleware shares its first-access set between them.
      - name: go test
        run: go test -race -cover ./...
      # Tests named *AsRoot skip without root: only root can create a file for
      # another user, which is what the token file ownership tests need. Own
      # cache, so no root-owned files are left in the runner's.
      - name: go test as root
        run: sudo env "PATH=$PATH" GOCACHE=/tmp/go-root-cache go test -run 'AsRoot$' ./...

  cross:
    name: cross-compile library (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Pi 1 / Zero", goos: linux, goarch: arm, goarm: "6" }
          - { name: "Pi 2/3/4 32-bit", goos: linux, goarch: arm, goarm: "7" }
          - { name: "Pi 3/4/5 64-bit", goos: linux, goarch: arm64 }
          - { name: "linux amd64", goos: linux, goarch: amd64 }
          - { name: "linux 386", goos: linux, goarch: "386" }
          - { name: "windows amd64", goos: windows, goarch: amd64 }
          - { name: "macOS arm64", goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # web/owner_unix.go and owner_other.go are the only platform split; both
      # sides are built here.
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...

  demo_app:
    name: demo_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/demo_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: demo/demo_app/go.mod
      # app/certs/ is deliberately not committed and webservices.go embeds it,
      # so nothing compiles before this runs.
      - name: generate dev certificate
        run: make ensure_dev_certs
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -cover ./...
      - name: go build
        run: go build ./...
      # Swagger lives behind a build tag so production binaries carry no docs
      # UI. That also means the tagged build is never exercised by default -
      # it was broken by a stale import path once already.
      - name: go build -tags swagger
        run: go build -tags swagger ./...

  demo_app_cross:
    name: cross-compile demo_app (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: demo_app
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Pi 1 / Zero", goos: linux, goarch: arm, goarm: "6" }
          - { name: "Pi 2/3/4 32-bit", goos: linux, goarch: arm, goarm: "7" }
          - { name: "Pi 3/4/5 64-bit", goos: linux, goarch: arm64 }
          - { name: "linux amd64", goos: linux, goarch: amd64 }
          - { name: "linux 386", goos: linux, goarch: "386" }
          - { name: "windows amd64", goos: windows, goarch: amd64 }
          - { name: "windows 386", goos: windows, goarch: "386" }
          - { name: "macOS arm64", goos: darwin, goarch: arm64 }
    defaults:
      run:
        working-directory: demo/demo_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: demo/demo_app/go.mod
      - name: generate dev certificate
        run: make ensure_dev_certs
      # One target per build_* recipe in the Makefile.
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...
