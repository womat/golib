# Keeps dependencies from drifting the way they had by 21.09.2026, when
# golang.org/x/crypto was nine minor releases behind.
#
# One gomod entry per module: demo/demo_app has its own go.mod, so a single
# entry would leave it unwatched. Updates are grouped, because the modules move
# together: the swagger generator on its own, everything else in one group, so a
# week brings at most two pull requests for them.
#
# To switch this off, delete this file. The CI workflow does not depend on it.

version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /demo/demo_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # "chore(deps): …", this repository's "type(scope): description" convention.
      prefix: "chore(deps)"
    groups:
      # The swagger generator drags in a large graph of its own that only
      # affects docs/generate.sh, never the production binary.
      swagger:
        patterns:
          - "github.com/swaggo/*"
          - "github.com/go-openapi/*"
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/swaggo/*"
          - "github.com/go-openapi/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # "chore(ci): …" - an action only changes the workflows, not the library.
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
